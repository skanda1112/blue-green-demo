name: Security Checks

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install -r requirements.txt bandit pip-audit

      - name: Unit and smoke tests
        run: python -m pytest -q

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: SAST - Bandit
        run: bandit -r app.py demo.py scripts

      - name: SCA - pip-audit
        run: pip-audit -r requirements.txt